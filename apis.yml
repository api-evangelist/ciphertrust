name: CipherTrust
description: >-
  CipherTrust Manager is Thales's centralized key- and data-security management
  platform and the control plane of the CipherTrust Data Security Platform (CDSP).
  It provides a unified plane for encryption key lifecycle management, secrets
  management, certificates, tokenization, data discovery, and policy enforcement
  across on-premises, hybrid, and multi-cloud environments including AWS, Azure,
  and Google Cloud, with HSM/KMIP integration, Kubernetes and DevSecOps support,
  role-based access controls, and post-quantum cryptography readiness. Developers
  and platform teams automate it through a REST API (base path /api/v1, JWT bearer
  authentication), an official HashiCorp Terraform provider (ThalesGroup/ciphertrust),
  an Ansible collection, and PowerShell orchestration modules, plus Application
  Protection SDKs for embedding encryption, key management, and tokenization in apps.
