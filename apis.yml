apis:
- name: CipherTrust Manager REST API
  description: >-
    REST API for the CipherTrust Manager control plane. Manages encryption keys,
    secrets, certificates, tokenization, users, connections, and policies. Base
    path /api/v1 with JWT bearer authentication obtained from POST /api/v1/auth/tokens.
    The API is served from the customer's CipherTrust Manager deployment (appliance,
    private cloud, or CipherTrust Data Security Platform as a Service), so there is
    no single public base host; a built-in Swagger playground ships on each instance.
